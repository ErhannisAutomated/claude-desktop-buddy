[platformio]
default_envs = wt32-sc01-plus

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; WT32-SC01 Plus
; The m5stack/M5StickCPlus lib is deliberately absent here: src/compat is on
; include path and comes with an M5StickCPlus.h shim that every source file uses
[env:wt32-sc01-plus]
; Pin to 6.x line (Arduino-ESP32 core 2.0.x)
; project uses the Bluedroid BLE API and the Arduino min()/max() macros,
; both changed/were removed in core 3.x.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
; Stage characters/bufo into data/ right before the LittleFS image is built, so
; pio run -t uploadfs always bundles a character
extra_scripts = pre:tools/prep_fs.py
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Isrc/compat
    -include src/compat/tft_setup_sc01plus.h
    ; Route Serial to the ESP32-S3 native USB (USB-Serial/JTAG, enumerates as
    ; ttyACM*). The board sets ARDUINO_USB_MODE=1 but leaves CDC_ON_BOOT at its
    ; default of 0, which keeps Serial on UART0 (GPIO43/44) — not the USB-C
    ; cable. =1 makes Serial the USB CDC, so the JSON wire protocol (and the
    ; Claude Code hook bridge) works over USB. See integrations/claude-code/.
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<buddies/> +<compat/>
lib_deps =
    ; SC01 Plus fork of TFT_eSPI
    ; mainline 8-bit parallel writer assumes all 8 data pins share one GPIO bank
    ; but this board has D1 on GPIO46 (bank 1) and rest in bank 0. Mainline, though, never toggles D1.
    ; This fork uses both banks. Same class names (TFT_eSPI/TFT_eSprite), so the
    ; firmware is unchanged.
    https://github.com/schuppeste/TFT_eSPI-WT32-sc01-Plus.git
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Same as wt32-sc01-plus, plus device-side ack instrumentation
; (-DBUDDY_DEBUG_ACK, see src/dbg.h). The firmware echoes a JSON line out USB
; Serial for every snapshot it applies and every prompt chirp it fires, so the
; host bridge can log what the device actually received and did. For chasing the
; missing-prompt-beep race only — flash deliberately:
;   pio run -e wt32-sc01-plus-debug -t upload
; and set BUDDY_ACK_READ=1 on the host (see integrations/claude-code/README.md).
[env:wt32-sc01-plus-debug]
extends = env:wt32-sc01-plus
build_flags =
    ${env:wt32-sc01-plus.build_flags}
    -DBUDDY_DEBUG_ACK
